<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', {window})"
>
  <groupbox>
    <label><html:h2 id="zotero-prefpane-__addonRef__-title">AI Collection Settings</html:h2></label>

    <!-- API Configuration Selector -->
    <vbox style="margin: 10px 0;">
      <hbox align="center" style="margin-bottom: 8px;">
        <html:label id="zotero-prefpane-__addonRef__-configLabel" for="zotero-prefpane-__addonRef__-configSelect" style="width: 120px;"
          >Configuration</html:label
        >
        <menulist
          id="zotero-prefpane-__addonRef__-configSelect"
          style="flex: 1; min-width: 200px;"
        >
          <menupopup id="zotero-prefpane-__addonRef__-configPopup">
          </menupopup>
        </menulist>
        <button
          id="zotero-prefpane-__addonRef__-saveConfig"
          label=""
          style="margin-left: 5px;"
        />
        <button
          id="zotero-prefpane-__addonRef__-renameConfig"
          label=""
          style="margin-left: 5px;"
        />
        <button
          id="zotero-prefpane-__addonRef__-deleteConfig"
          label=""
          style="margin-left: 5px;"
        />
      </hbox>

      <hbox align="center" style="margin-bottom: 8px;">
        <html:label id="zotero-prefpane-__addonRef__-apiUrlLabel" for="zotero-prefpane-__addonRef__-apiUrl" style="width: 120px;"
          >API Endpoint</html:label
        >
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-apiUrl"
          preference="__prefsPrefix__.apiUrl"
          style="flex: 1; min-width: 300px;"
        />
      </hbox>

      <hbox align="center" style="margin-bottom: 8px;">
        <html:label id="zotero-prefpane-__addonRef__-modelLabel" for="zotero-prefpane-__addonRef__-model" style="width: 120px;"
          >Model Name</html:label
        >
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-model"
          preference="__prefsPrefix__.model"
          style="flex: 1; min-width: 300px;"
        />
      </hbox>

      <hbox align="center" style="margin-bottom: 8px;">
        <html:label id="zotero-prefpane-__addonRef__-apiKeyLabel" for="zotero-prefpane-__addonRef__-apiKey" style="width: 120px;"
          >API Key</html:label
        >
        <html:input
          type="password"
          id="zotero-prefpane-__addonRef__-apiKey"
          preference="__prefsPrefix__.apiKey"
          style="flex: 1; min-width: 300px;"
        />
        <html:button
          id="zotero-prefpane-__addonRef__-toggleApiKey"
          style="margin-left: 5px; width: 30px; height: 24px; cursor: pointer; font-size: 14px;"
          title="Toggle API Key visibility"
        >&#128065;</html:button>
      </hbox>

      <hbox style="margin-top: 10px; align-items: flex-start;">
        <button
          id="zotero-prefpane-__addonRef__-test"
          label=""
        />
      </hbox>
      <hbox style="margin-top: 5px;">
        <html:div
          id="zotero-prefpane-__addonRef__-testResult"
          style="font-size: 12px; padding: 5px; min-height: 20px; color: #666;"
        ></html:div>
      </hbox>
    </vbox>
  </groupbox>

  <groupbox>
    <label><html:h2 id="zotero-prefpane-__addonRef__-promptTitle">Classification Prompt</html:h2></label>
    <vbox style="margin: 10px 0;">
      <html:label id="zotero-prefpane-__addonRef__-promptHelp" style="margin-bottom: 5px; color: #666; font-size: 12px;">
        Customize the prompt that guides LLM to recommend classifications (do not change the output format requirement):
      </html:label>
      <html:textarea
        id="zotero-prefpane-__addonRef__-customPrompt"
        preference="__prefsPrefix__.customPrompt"
        style="width: 100%; min-height: 80px; resize: vertical; font-family: monospace;"
      ></html:textarea>
      <hbox style="margin-top: 8px;">
        <button
          id="zotero-prefpane-__addonRef__-savePrompt"
          label=""
        />
        <button
          id="zotero-prefpane-__addonRef__-resetPrompt"
          label=""
          style="margin-left: 5px;"
        />
      </hbox>
    </vbox>
  </groupbox>

  <groupbox>
    <label><html:h2 id="zotero-prefpane-__addonRef__-collectionTitle">Collection Selection</html:h2></label>
    <vbox style="margin: 10px 0;">
      <html:label id="zotero-prefpane-__addonRef__-collectionHelp" style="margin-bottom: 5px; color: #666; font-size: 12px;">
        Select which collections are available for AI classification:
      </html:label>
      <hbox style="margin-bottom: 8px;">
        <button
          id="zotero-prefpane-__addonRef__-selectAll"
          label=""
        />
        <button
          id="zotero-prefpane-__addonRef__-deselectAll"
          label=""
          style="margin-left: 5px;"
        />
        <button
          id="zotero-prefpane-__addonRef__-refreshCollections"
          label=""
          style="margin-left: 5px;"
        />
      </hbox>
      <html:div
        id="zotero-prefpane-__addonRef__-collectionTree"
        style="
          border: 1px solid var(--fill-quinary);
          border-radius: 4px;
          padding: 8px;
          max-height: 200px;
          overflow-y: auto;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 13px;
        "
      >
        <html:div id="zotero-prefpane-__addonRef__-loadingText" style="color: #999;">Loading collections...</html:div>
      </html:div>
      <html:label id="zotero-prefpane-__addonRef__-collectionTip" style="margin-top: 5px; color: #888; font-size: 11px;">
        Unchecked collections will not be provided to AI for selection.
      </html:label>
    </vbox>
  </groupbox>

  <groupbox>
    <label><html:h2 id="zotero-prefpane-__addonRef__-behaviorTitle">Classification Behavior</html:h2></label>
    <vbox style="margin: 10px 0;">
      <!-- Processing Mode -->
      <html:label id="zotero-prefpane-__addonRef__-processingModeLabel" style="font-weight: bold; margin-bottom: 8px;">Processing Mode</html:label>
      <radiogroup
        id="zotero-prefpane-__addonRef__-batchMode"
        preference="__prefsPrefix__.batchMode"
      >
        <radio
          id="zotero-prefpane-__addonRef__-modeOneByOne"
          value="false"
          label=""
        />
        <radio
          id="zotero-prefpane-__addonRef__-modeBatch"
          value="true"
          label=""
        />
      </radiogroup>
      <html:label id="zotero-prefpane-__addonRef__-batchModeHelp" style="margin-left: 20px; color: #666; font-size: 11px; margin-bottom: 12px;">
        Batch mode processes all selected items with AI first, then shows a single dialog for reviewing all results.
      </html:label>

      <!-- Add to all path collections -->
      <hbox align="center" style="margin-bottom: 8px; margin-top: 8px;">
        <checkbox
          id="zotero-prefpane-__addonRef__-addToAllPathCollections"
          preference="__prefsPrefix__.addToAllPathCollections"
          label=""
        />
      </hbox>
      <html:label id="zotero-prefpane-__addonRef__-addToAllPathHelp" style="margin-left: 20px; color: #666; font-size: 11px;">
        When unchecked, items will only be added to the leaf collection (e.g., just "c" in path A/b/c).
        When checked, items will be added to all collections along the path.
      </html:label>

      <hbox align="center" style="margin-top: 12px;">
        <html:label id="zotero-prefpane-__addonRef__-archiveLabel" for="zotero-prefpane-__addonRef__-archiveCollectionName" style="width: 180px;"
          >Archive Collection Name</html:label
        >
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-archiveCollectionName"
          preference="__prefsPrefix__.archiveCollectionName"
          style="flex: 1; min-width: 200px;"
        />
      </hbox>
      <html:label id="zotero-prefpane-__addonRef__-archiveHelp" style="margin-left: 20px; color: #666; font-size: 11px;">
        The collection name for "Reject &amp; Archive" button. Will be created if it doesn't exist.
      </html:label>
    </vbox>
  </groupbox>

  <groupbox>
    <label><html:h2 id="zotero-prefpane-__addonRef__-translationTitle">Translation Settings</html:h2></label>
    <vbox style="margin: 10px 0;">
      <hbox align="center">
        <checkbox
          id="zotero-prefpane-__addonRef__-enableChineseTranslation"
          preference="__prefsPrefix__.enableChineseTranslation"
          label=""
        />
      </hbox>
    </vbox>
  </groupbox>

  <vbox>
    <html:label>__addonName__ VERSION __buildVersion__ Build __buildTime__</html:label>
  </vbox>
</vbox>
